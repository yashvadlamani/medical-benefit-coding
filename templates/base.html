<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Benefit coding review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">Benefit coding review</a>
    <span class="tag">Prototype · public plan data · placeholder codes</span>
    <form class="reviewer" method="post" action="{{ url_for('set_reviewer') }}">
      <input type="hidden" name="next" value="{{ request.full_path }}">
      <label for="name">Reviewer</label>
      <input id="name" name="name" value="{{ reviewer }}" placeholder="Your name" required maxlength="60">
      <button type="submit">Save</button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
